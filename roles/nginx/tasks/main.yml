---
- name: Install Nginx on Debian Family
  apt:
    name: nginx
    state: latest
    update_cache: yes
  when: ansible_os_family == "Debian"
  notify:
    - nginx restart

- name: Replace nginx.conf
  template:
    src: templates/nginx.conf
    dest: /etc/nginx/nginx.conf
  notify:
    - nginx restart
